# Station v1.0.0 binding reference
#
# IMPORTANT: Omarchy Quattro uses Hyprland Lua configuration. This .conf file
# is NOT sourced by the plugin. The live bindings are station-bindings.lua.
# It is kept as a human-readable reference / compatibility artifact.
#
# Navigation
# bind = CTRL + SUPER, LEFT, exec, station switch prev
# bind = CTRL + SUPER, RIGHT, exec, station switch next
#
# Direct station selection
# bind = CTRL + SUPER, F1..F5, exec, station switch 1..5
#
# Move + follow
# bind = SHIFT + CTRL + SUPER, F1..F5, exec, station move 1..5
#
# Move silently
# bind = SHIFT + SUPER + ALT, F1..F5, exec, station move-silent 1..5
#
# Directional movement
# bind = SHIFT + CTRL + SUPER, LEFT/RIGHT/UP/DOWN, exec, station move-dir <direction>
