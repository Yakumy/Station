name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build-and-attest:
    runs-on: ubuntu-24.04
    container:
      # Official Bun 1.4.2 linux/amd64 image, pinned to its architecture-
      # specific OCI manifest. The host runner only orchestrates the job;
      # compilation happens inside this immutable userspace.
      image: oven/bun@sha256:296a79bbc988bb0a91ef11099af70a78a8cba98b73fd53f7b2a7715b7c86ced2
      options: --user 0
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)",?$/\1/p' manifest.json)"
          test -n "$manifest_version"
          test "$GITHUB_REF_NAME" = "v$manifest_version"

      - name: Verify pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(bun --version)" = "1.4.2"
          echo "a83d263767d839e4d2649ca8e35d07159c7afc99afdc96d731ced29e056dda0c  $(command -v bun)" | sha256sum -c -

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          build_root=/tmp/station-build
          test ! -e "$build_root"
          mkdir -p "$build_root/source" "$build_root/home" "$build_root/toolchain"
          cp -a "$GITHUB_WORKSPACE/." "$build_root/source/"
          ln -s "$(command -v bun)" "$build_root/toolchain/bun"
          cd "$build_root/source"
          env -i \
            HOME="$build_root/home" \
            LC_ALL=C.UTF-8 \
            PATH="$build_root/toolchain:/usr/bin:/bin" \
            "$build_root/toolchain/bun" build \
              --compile \
              --minify \
              --bytecode \
              --no-compile-autoload-dotenv \
              --no-compile-autoload-bunfig \
              index.js --outfile bin/station
          install -m 0755 bin/station "$GITHUB_WORKSPACE/bin/station"

      - name: Verify reviewed binary digest
        shell: bash
        run: |
          set -euo pipefail
          cp "release/checksums/${GITHUB_REF_NAME}-linux-x64.sha256" bin/station.sha256
          cd bin
          sha256sum -c station.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bin/station

      - name: Upload verified release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: station-release
          path: |
            bin/station
            bin/station.sha256
          if-no-files-found: error
          retention-days: 1

  publish-draft:
    needs: build-and-attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out reviewed release metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download verified release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: station-release
          path: bin

      - name: Reverify transferred binary
        shell: bash
        run: |
          set -euo pipefail
          cmp "release/checksums/${GITHUB_REF_NAME}-linux-x64.sha256" bin/station.sha256
          cd bin
          sha256sum -c station.sha256

      - name: Create draft release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            bin/station
            bin/station.sha256
