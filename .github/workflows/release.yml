name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)",?$/\1/p' manifest.json)"
          test -n "$manifest_version"
          test "$GITHUB_REF_NAME" = "v$manifest_version"

      - name: Build
        run: >-
          bun build --compile --minify --bytecode
          --no-compile-autoload-dotenv
          --no-compile-autoload-bunfig
          index.js --outfile bin/station

      - name: Checksum
        run: sha256sum bin/station > bin/station.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1
        with:
          subject-path: bin/station

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            bin/station
            bin/station.sha256
