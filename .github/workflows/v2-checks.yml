name: Station v2 checks
on:
  push:
    branches: [dev]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test M0 tooling
        run: node --test test/m0/*.test.mjs
      - name: Test v2 core
        run: node --test test/v2/*.test.cjs
      - name: Install Qt pointer-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript
      - name: Test display dragging offscreen
        run: python3 tools/v2/check-layout.py
      - name: Check probe theme tokens
        run: node tools/v2/check-theme-tokens.mjs tools/v2/m0-plugin
      - name: Reject literal palettes and symlinks in v2 sources
        run: node tools/v2/check-theme-tokens.mjs
