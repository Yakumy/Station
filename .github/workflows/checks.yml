name: Station checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: station-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Station portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install test interpreters
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.4 perl python3
      - name: Run portable regression tests
        run: node --test test/m0/*.test.mjs test/v2/*.test.cjs
      - name: Check theme tokens
        run: node tools/v2/check-theme-tokens.mjs
      - name: Check whitespace
        run: git show --format= --check HEAD
